---
# =============================================================================
# Despliegue automático de comunitarios.org en cPanel
#
# Lo ejecuta cPanel → Git™ Version Control → «Pull or Deploy» → botón
# «Deploy HEAD Commit», después de haber traído los cambios con
# «Update from Remote».
#
# NO HAY NADA QUE EDITAR A MANO. Las dos rutas que antes estaban escritas
# —la del repositorio y la de PHP— se deducen solas:
#
#   - El repositorio: cPanel ejecuta estas tareas desde la raíz del repo, asi
#     que `pwd` ya es la ruta buena, la clone donde la clone. En esta cuenta
#     es /home/comuonal/repositories/comunitarios, pero no hace falta saberlo.
#
#   - PHP: se usa el de la version elegida en «Select PHP Version», que es el
#     que responde a `php`. Si ahi no hubiera ninguno, se prueban las rutas de
#     EasyApache para 8.3 y 8.2.
#
# El Document Root del dominio apunta a la carpeta `public/` de este mismo
# repositorio, asi que el despliegue NO COPIA NADA: solo deja la aplicacion
# lista. Si alguna vez el sitio no reflejara los cambios despues de desplegar,
# lo primero que hay que mirar es si el Document Root sigue apuntando aqui.
#
# Lo que NO hace, porque el servidor no tiene las herramientas:
#   - composer install  → vendor/ viaja dentro del propio repositorio
#   - npm run build     → public/build/ tambien
#
# Si una tarea falla, cPanel aborta las siguientes y el sitio SE QUEDA EN
# MANTENIMIENTO. Para levantarlo, en cPanel → Terminal:
#
#   cd /home/comuonal/repositories/comunitarios && php artisan up
# =============================================================================

deployment:
  tasks:
    # ── Donde esta el proyecto ───────────────────────────────────────────────
    - export DP="$(pwd)"
    - test -f "$DP/artisan" || export DP=/home/comuonal/repositories/comunitarios

    # ── Con que PHP ──────────────────────────────────────────────────────────
    - export PHP="$(command -v php || true)"
    - test -x "$PHP" || export PHP=/opt/cpanel/ea-php83/root/usr/bin/php
    - test -x "$PHP" || export PHP=/opt/cpanel/ea-php82/root/usr/bin/php

    # Queda anotado en el registro del despliegue: si algo falla, lo primero
    # que hay que mirar es si estas dos lineas dicen lo que deberian.
    - echo "Desplegando $DP con $PHP ($($PHP -r 'echo PHP_VERSION;'))"

    # ── El despliegue ────────────────────────────────────────────────────────

    # Nadie ve una pagina a medio migrar.
    - $PHP $DP/artisan down --render="errors::503"

    # --force porque en produccion migrate pide confirmacion por teclado y
    # aqui no hay nadie para darsela.
    - $PHP $DP/artisan migrate --force

    # config:clear ANTES de config:cache: si quedo una cache vieja de un .env
    # anterior, config:cache la regeneraria a partir de valores ya obsoletos.
    - $PHP $DP/artisan config:clear
    - $PHP $DP/artisan config:cache
    - $PHP $DP/artisan route:cache

    # view:clear antes de view:cache: sin esto, una plantilla Blade que cambio
    # —la portada, por ejemplo— se seguiria sirviendo compilada de antes.
    - $PHP $DP/artisan view:clear
    - $PHP $DP/artisan view:cache

    - $PHP $DP/artisan up
